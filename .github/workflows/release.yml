name: release

# Triggered when a maintainer pushes a v* tag. Builds a clean tarball
# from the tag, signs it with cosign keyless (sigstore + GitHub OIDC),
# and uploads tarball + .sig.json + .sha256 as release assets.
#
# run.sh and install.sh verify with an exact --certificate-identity: this
# repo's release.yml at the tag installed. Sigstore + Rekor are a trust root
# independent of github.com, so a compromised upstream cannot forge a signature.

# SECURITY (repo-settings, can't be enforced from this file alone): the
# end-user trust chain (run.sh's cosign verify-blob) ultimately reduces to
# "who can push a v* tag here". Harden it in repo settings:
#   1. A tag protection ruleset on refs/tags/v* that blocks tag
#      create/update/delete by non-maintainers (and blocks force-moving an
#      existing tag — complements the in-workflow immutability guard below).
#   2. A GitHub Environment (e.g. `release`) with required reviewers, then add
#      `environment: release` to the job, so signing+publishing needs an
#      explicit human approval. Without this, any collaborator with write can
#      mint a validly-signed release indistinguishable from a legitimate one.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # create release + upload assets
  id-token: write    # sigstore keyless OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # git archive needs the full history of the tag.
          fetch-depth: 0

      - name: Install cosign
        # Pin the action to a full commit SHA, NOT the mutable @v3.7.0 tag:
        # this job holds id-token:write, so a re-pointed installer tag could
        # exfiltrate/abuse the OIDC token or alter the signing step while
        # still producing a release that passes downstream verification. The
        # SHA below is v3.7.0; bump (resolve the new tag to its commit SHA)
        # only after review. `cosign-release` separately pins the cosign binary.
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: 'v2.4.1'

      - name: Assert VERSION matches the tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The VERSION file is what every runtime surface reports (core/common.sh
          # reads it). Publishing a tag it disagrees with ships a release that
          # misreports its own identity in --version, status and all three report
          # formats — which is how the old hardcoded constant sat at 1.2.0 for 37
          # commits. Refuse the release instead: bump VERSION and re-tag.
          if [[ ! -f VERSION ]]; then
              echo "::error::VERSION file is missing"
              exit 1
          fi
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$FILE_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*$ ]]; then
              echo "::error::VERSION content is not a version string (got: '$FILE_VER')"
              exit 1
          fi
          if [[ "v$FILE_VER" != "$TAG" ]]; then
              echo "::error::VERSION says '$FILE_VER' but the tag is '$TAG'. Bump VERSION, commit, and move the tag."
              exit 1
          fi
          echo "VERSION and tag agree: $TAG"

      - name: Build tarball
        id: build
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          ARCHIVE="vpssec-${VER}.tar.gz"
          # `git archive` produces a clean, reproducible tarball — matches
          # `git clone` content at this tag, excludes .git/ and anything in
          # .gitignore. The prefix gives a single top-level dir on extract.
          git archive --format=tar.gz \
              --prefix="vpssec-${VER}/" \
              -o "$ARCHIVE" \
              "$TAG"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Sign tarball (cosign keyless via sigstore)
        env:
          # Skip the interactive "are you sure" prompt — this is non-tty CI.
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          ARCHIVE="${{ steps.build.outputs.archive }}"
          # --bundle emits a single self-contained file: signature + signing
          # cert + Rekor transparency-log inclusion proof. Verifiers only
          # need this one file alongside the tarball.
          cosign sign-blob \
              --bundle "${ARCHIVE}.sig.json" \
              "$ARCHIVE"

      - name: Create or update release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          ARCHIVE="${{ steps.build.outputs.archive }}"

          # Never replace a signed tarball already published under this tag: a re-signed
          # swap still verifies. Only gh's "release not found" means no release yet; any
          # other failure to list the assets stops here, since it cannot rule one out.
          if ! assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>&1); then
              if [[ "$assets" != "release not found" ]]; then
                  echo "::error::Could not list the assets of release $TAG: $assets"
                  exit 1
              fi
              gh release create "$TAG" \
                  --title "$TAG" \
                  --generate-notes
          elif grep -qxF -- "$ARCHIVE" <<<"$assets"; then
              echo "::error::Release $TAG already has $ARCHIVE; refusing to overwrite a published, signed asset. Cut a new version tag instead."
              exit 1
          fi

          # --clobber only reaches a re-run that stopped before the tarball was
          # published (the guard above refuses the rest): it keeps re-uploading
          # .sha256/.sig.json after a partial upload idempotent.
          gh release upload "$TAG" \
              "$ARCHIVE" \
              "${ARCHIVE}.sha256" \
              "${ARCHIVE}.sig.json" \
              --clobber
