name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  bats:
    # The runner's own user, not root: the non-root paths run here, while the
    # tests that need root skip -- bats-container runs those, on Debian too.
    name: bats unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install bats-core
        run: |
          set -euo pipefail
          # Pin to a specific tag rather than `apt install bats` so the
          # CI behaviour doesn't drift with Ubuntu's package archive.
          BATS_VERSION=v1.11.0
          tmp=$(mktemp -d)
          git clone --depth 1 --branch "$BATS_VERSION" \
              https://github.com/bats-core/bats-core.git "$tmp/bats"
          sudo "$tmp/bats/install.sh" /usr/local
          bats --version

      - name: Run bats tests
        run: bats tests/

  bats-container:
    # As root, in containers: Rocky and Arch have no GitHub runner, and on
    # Debian the ownership tests (crontab group, at.deny root:daemon) run
    # instead of skipping. Arch is :latest (rolling); the others pin a major.
    name: bats on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash  # a container's default is sh, dash on debian:12: no pipefail
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            image: debian:12
          - distro: rocky
            image: rockylinux:9
          - distro: arch
            image: archlinux:latest
    steps:
      # Dispatched on a plain identifier, never a ${{ }} command string in run:.
      - name: Install dependencies
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -eu
          # git for checkout, jq for vpssec, python3 for one fixture (Rocky ships
          # it). Debian adds what its root-only tests read: the crontab group
          # (cron), /etc/at.deny (at) and cvtsudoers (sudo).
          case "$DISTRO" in
              debian) apt-get update -qq
                      apt-get install -y -qq --no-install-recommends \
                          ca-certificates git jq python3 cron at sudo ;;
              rocky) dnf -q -y install git jq ;;
              arch)  pacman -Syu --noconfirm --needed git jq python ;;  # -Sy alone: a partial upgrade
              *)     echo "unknown distro: $DISTRO" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install bats-core
        run: |
          set -euo pipefail
          BATS_VERSION=v1.11.0
          tmp=$(mktemp -d)
          git clone --depth 1 --branch "$BATS_VERSION" \
              https://github.com/bats-core/bats-core.git "$tmp/bats"
          "$tmp/bats/install.sh" /usr/local
          bats --version

      - name: Run bats tests
        run: bats tests/

  i18n-parity:
    name: i18n key parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Compare i18n key sets
        # Both language files MUST contain exactly the same set of
        # dotted-key paths. A missing key falls back to printing the
        # raw key in the UI (`i18n` helper in core/common.sh) — easy
        # to overlook in code review, easy to catch here.
        run: |
          set -euo pipefail
          en=$(jq -r 'paths(scalars) | join(".")' core/i18n/en_US.json | sort)
          zh=$(jq -r 'paths(scalars) | join(".")' core/i18n/zh_CN.json | sort)

          if diff -u <(echo "$en") <(echo "$zh"); then
              echo "OK: i18n keys are identical between en_US and zh_CN."
          else
              echo
              echo "ERROR: i18n key sets diverge between en_US and zh_CN."
              echo "Add the missing keys (or remove the orphan ones) before merging."
              exit 1
          fi

  module-contract:
    name: module function contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Verify each registered module exports _audit and _fix
        # Every module in VPSSEC_MODULE_ORDER must define <name>_audit and
        # <name>_fix: a half-done addition (forgot _fix, forgot to register)
        # fails here at PR time instead of at audit time.
        run: |
          set -euo pipefail
          # Source engine.sh just to read VPSSEC_MODULE_ORDER. We
          # stub VPSSEC_CORE/MODULES because engine.sh's top sources
          # security_levels via that path; we only need the array.
          export VPSSEC_CORE="$PWD/core"
          export VPSSEC_MODULES="$PWD/modules"
          # shellcheck source=/dev/null
          source core/engine.sh

          fail=0
          for module in "${VPSSEC_MODULE_ORDER[@]}"; do
              file="modules/${module}.sh"
              if [[ ! -f "$file" ]]; then
                  echo "::error::Module ${module} listed in VPSSEC_MODULE_ORDER but ${file} missing"
                  fail=1
                  continue
              fi
              if ! grep -qE "^${module}_audit\s*\(\s*\)\s*\{" "$file"; then
                  echo "::error::${file} does not export ${module}_audit()"
                  fail=1
              fi
              if ! grep -qE "^${module}_fix\s*\(\s*\)\s*\{" "$file"; then
                  echo "::error::${file} does not export ${module}_fix()"
                  fail=1
              fi
              if [[ -z "${VPSSEC_MODULE_CATEGORY[$module]:-}" ]]; then
                  echo "::error::Module ${module} not classified in VPSSEC_MODULE_CATEGORY"
                  fail=1
              fi
          done

          exit "$fail"

  mutation-integration:
    # The one job that runs vpssec against a real /etc: plant a defect, expect
    # the audit to report it, apply the fix through `guide --fix`, roll it back
    # through `rollback`, asserting the audit's verdict after each step.
    name: real /etc — mutate, audit, fix, rollback
    runs-on: ubuntu-latest
    # Runs take 5-12 minutes here and about 21 on a loaded laptop; the default
    # of 360 would let one hung case hold the job for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run the mutation cases in a throwaway systemd container
        run: bash tests/mutation/run-in-container.sh
